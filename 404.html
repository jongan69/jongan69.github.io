<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found · Jon Gan</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14;
      --surface: #111720;
      --text: #e6edf3;
      --text-secondary: #9aa7b4;
      --border: #1e2732;
      --accent: #5eead4;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin: 0 0 12px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 26px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 18px;
      transition: border-color 0.2s, color 0.2s;
    }
    a:hover, a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
    a.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06120f;
      border-color: transparent;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This page has moved or no longer exists. The projects, experience, and contact details are all on the portfolio.</p>
    <div class="row">
      <a class="primary" href="/">Back to portfolio</a>
      <a href="/#work">View projects</a>
      <a href="mailto:jongan.engineering@outlook.com">Email Jonathan</a>
      <a href="https://github.com/jongan69" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
